apiVersion: apps/v1
kind: Deployment
metadata:
  name: ase-api
spec:
  replicas: 2
  selector:
    matchLabels: {app: ase-api}
  template:
    metadata:
      labels: {app: ase-api}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: ghcr.io/madanmohan0537/autonomous-software-engineer-platform:latest
          ports: [{containerPort: 8000}]
          envFrom: [{secretRef: {name: ase-secrets}}]
          readinessProbe: {httpGet: {path: /health, port: 8000}}
          livenessProbe: {httpGet: {path: /health, port: 8000}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: ase-api
spec:
  selector: {app: ase-api}
  ports: [{port: 80, targetPort: 8000}]

