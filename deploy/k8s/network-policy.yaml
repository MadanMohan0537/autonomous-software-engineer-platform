apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ase-default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ase-api-ingress
spec:
  podSelector:
    matchLabels: {app: ase-api}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports: [{protocol: TCP, port: 8000}]

