name: Container

on:
  pull_request:
    paths:
      - Dockerfile
      - pyproject.toml
      - src/**
      - .github/workflows/container.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ase:test

