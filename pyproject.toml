[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "autonomous-software-engineer"
version = "0.2.0"
description = "Governed issue-to-draft-PR engineering agent: repo intelligence, sandboxed workflow, verification, evals, feedback"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "networkx>=3.2,<4",
  "numpy>=1.26,<3",
  "pydantic>=2.8,<3",
  "pyyaml>=6,<7",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
# tree-sitter parsing (the standard-library parser is the fallback without it)
index = [
  "tree-sitter>=0.25,<0.27",
  "tree-sitter-python>=0.23,<0.26",
]
# durable, interruptible workflow (the sequential runner is the fallback without it)
graph = [
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=2.0,<4",
]
# tools the sandbox image needs for coverage-guided test generation
sandbox = [
  "coverage>=7,<8",
  "hypothesis>=6,<7",
  "pytest>=8.3,<10",
]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
]

[project.scripts]
ase = "ase.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ase"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["ase"]

[[tool.mypy.overrides]]
module = ["yaml", "yaml.*", "networkx", "networkx.*", "tree_sitter_python", "langgraph", "langgraph.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["ase"]
